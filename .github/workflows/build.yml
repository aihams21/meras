name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            desktop-file-utils

      - name: Guard against forbidden characters
        run: python tests/guard_text.py

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Build packages
        run: python tools/build_deb.py

      - name: Package the portable tarball
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meras-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  windows:
    name: Windows executable
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller

      - name: Guard against forbidden characters
        run: python tests/guard_text.py

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Build executable
        run: python tools/build_app.py

      - name: Write checksums
        run: |
          cd dist
          (Get-FileHash *.exe -Algorithm SHA256) | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meras-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.exe' \) \
            -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS.txt > release/SHA256SUMS.txt
          (cd release && sha256sum -c SHA256SUMS.txt)
          ls -la release/

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## ميراس · Meras ${{ github.ref_name }}

            تطبيق سطح مكتب لتحرير المساحة. تنقر عليه مرتين، تفتحلك نافذة.
            ما في متصفح ولا شريط عنوان: كل شي بيشتغل خلف الكواليس.

            A real desktop space cleaner. Double click it and a native window
            opens. No browser, no address bar, nothing of the web stack visible.

            ### ويندوز · Windows

            نزّل `meras-${{ github.ref_name }}-windows.exe` وشغّله بنقرة.
            إذا ظهر تحذير SmartScreen اختر **More info** ثم **Run anyway**،
            لأن البناء غير موقّع رقمياً.

            Download the executable and run it. If SmartScreen warns, choose
            "More info" then "Run anyway" because the build is unsigned.

            ### لينكس · Linux

            ```bash
            sudo apt install ./meras_*_amd64.deb
            ```

            أو بدون تنصيب، بالنسخة المحمولة:

            ```bash
            tar -xzf meras-*-linux.tar.gz
            cd meras
            python3 run.py
            ```

            ### التحقق من السلامة · Verify

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### ما في حذف نهائي · Nothing is deleted permanently

            الملف اللي بتختاره بينقل **سلة** داخل بيتك ومعه سجلّ يقدر يرجّعه
            بضغطة. ملفات النظام والإعدادات ومفاتيح الألعاب والملفات الطازجة
            مرفوضة من طبقة حماية مستقلة.

            Selected items move to a quarantine folder inside your home
            directory, recorded in a manifest, and restorable with one click.
            System files, settings, game saves and anything modified in the
            last 24 hours are refused by a dedicated safety layer.